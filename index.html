<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Gun Battle - 3D FPS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #menu h1 {
            color: #ff5722;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
        }
        #playBtn {
            padding: 15px 40px;
            font-size: 24px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #playBtn:hover {
            background-color: #e64a19;
        }
        #statusMessage {
            color: #aaa;
            margin-top: 15px;
            font-size: 18px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <!-- Écran de Menu & Matchmaking -->
    <div id="menu">
        <h1>FOX GUN BATTLE</h1>
        <button id="playBtn">JOUER</button>
        <div id="statusMessage">Clique pour lancer la recherche de partie...</div>
    </div>

    <!-- Interface en jeu -->
    <div id="ui">
        <div>Statut : <span id="gameStatus">Dans le menu</span></div>
        <div>Commandes : ZQSD (Bouger) | Souris (Regarder) | F (Construire un mur)</div>
    </div>

    <div id="crosshair"></div>

    <!-- Inclusion de Socket.io et Three.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const socket = io();

        // Éléments DOM
        const menu = document.getElementById('menu');
        const playBtn = document.getElementById('playBtn');
        const statusMessage = document.getElementById('statusMessage');
        const gameStatus = document.getElementById('gameStatus');

        // Configuration Three.js (Scène, Caméra, Rendu)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Ciel bleu

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); // Hauteur des yeux

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lumière
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Sol (Map)
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- SYSTÈME DE CONSTRUCTION (Façon Fortnite) ---
        const walls = [];
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyF') {
                buildWall();
            }
        });

        function buildWall() {
            const wallGeometry = new THREE.BoxGeometry(4, 3, 0.3); // Mur en bois
            const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xa0522d });
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);

            // Positionner le mur devant la caméra
            const distance = 4;
            const vector = new THREE.Vector3(0, 0, -distance);
            vector.applyQuaternion(camera.quaternion);

            wall.position.copy(camera.position).add(vector);
            wall.position.y = 1.5; // Hauteur du sol

            scene.add(wall);
            walls.push(wall);
            console.log("Mur construit !");
        }

        // --- GESTION DU MATCHMAKING ---
        playBtn.addEventListener('click', () => {
            playBtn.style.display = 'none';
            statusMessage.innerText = "Recherche d'un joueur en cours (10s max)...";
            gameStatus.innerText = "Recherche...";

            // Demander une partie au serveur
            socket.emit('find_match');
        });

        // Écoute de la réponse du serveur (Trouvé un joueur ou un bot)
        socket.on('match_found', (data) => {
            statusMessage.innerText = "Partie trouvée ! Chargement...";
            setTimeout(() => {
                menu.style.display = 'none'; // Cacher le menu et lancer le jeu
                gameStatus.innerText = "En jeu contre : " + data.opponent;
                
                // Activer le verrouillage de la souris pour bouger la caméra FPS
                document.body.requestPointerLock();
            }, 1000);
        });

        // Contrôles de la caméra à la souris
        let pitch = 0;
        let yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                const sensitivity = 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                // Limiter la vue verticale pour ne pas tourner sur soi-même
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                camera.rotation.set(0, 0, 0);
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        // Gestion des déplacements basiques (ZQSD)
        const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        function updateMovement() {
            const speed = 0.1;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; // Rester sur le plan horizontal
            dir.normalize();

            const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            if (keys.KeyW) camera.position.addScaledVector(dir, speed);
            if (keys.KeyS) camera.position.addScaledVector(dir, -speed);
            if (keys.KeyA) camera.position.addScaledVector(sideDir, speed);
            if (keys.KeyD) camera.position.addScaledVector(sideDir, -speed);
        }

        // Boucle de rendu du jeu
        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            renderer.render(scene, camera);
        }
        animate();

        // Adapter la taille de l'écran si la fenêtre change
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
